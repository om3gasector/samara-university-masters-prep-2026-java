<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <title>Повторение</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

g:0}.checkbox-label input[type="checkbox"]{appearance:checkbox!important;-webkit-appearance:checkbox!important;-moz-appearance:checkbox!important;min-width:1rem!important;min-height:1rem!important;width:1rem!important;height:1rem!important;cursor:pointer!important;accent-color:#58a6ff!important;margin:0!important;padding:0!important;opacity:1!important;visibility:visible!important;display:inline-block!important;position:relative!important;background:transparent!important;border:none!important;border-radius:0!important}.checkbox-label input[type="checkbox"]:checked{accent-color:#58a6ff!important}.toolbar-row-actions button{flex-shrink:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:.85rem;font-weight:400;padding:.35rem .7rem}.error{color:#f85149;font-size:.9rem;margin:0 0 1rem;font-weight:400}button{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:400;cursor:pointer;border-radius:6px;border:1px solid #30363d;background:#161b22;color:#e6edf3;padding:.5rem .85rem;transition:border-color .15s ease}button:hover{border-color:#58a6ff}.loading,.empty{color:#8b949e;font-weight:400}.hidden{display:none!important}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:1.25rem 1.25rem 1.5rem}.meta{font-size:.75rem;font-weight:400;color:#8b949e;margin:0 0 1rem;word-break:break-all;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}.label{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#8b949e;margin:0 0 .35rem}.front{font-size:1.15rem;font-weight:600;margin-bottom:1rem;line-height:1.5}.front code{font-size:.9em;font-weight:600}.reveal{width:100%;padding:.65rem;margin-bottom:1rem;background:#21262d;border-color:#58a6ff;color:#58a6ff;font-weight:600}.back-wrap{margin-bottom:1rem}.back{font-size:.95rem;font-weight:400;color:#e6edf3;line-height:1.6}.markdown-body>:first-child{margin-top:0}.markdown-body>:last-child{margin-bottom:0}.markdown-body p{margin:.5em 0}.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4{margin:.85em 0 .4em;font-weight:600;line-height:1.4;border-bottom:1px solid #30363d;padding-bottom:.2em}.markdown-body h1{font-size:1.25rem}.markdown-body h2{font-size:1.1rem}.markdown-body h3,.markdown-body h4{font-size:1rem;border-bottom:none}.markdown-body ul,.markdown-body ol{margin:.5em 0;padding-left:1.35rem}.markdown-body li{margin:.2em 0}.markdown-body blockquote{margin:.6em 0;padding:.35em 0 .35em 1em;border-left:4px solid #58a6ff;color:#8b949e}.markdown-body code{font-family:'JetBrains Mono','Cascadia Code','Fira Code',monospace;font-size:.88em;background:#21262d;padding:.12em .35em;border-radius:4px;border:1px solid #30363d}.markdown-body pre{margin:.65em 0;padding:.75rem 1rem;overflow:auto;font-size:.82rem;line-height:1.5;background:#0d1117;border:1px solid #30363d;border-radius:8px}.markdown-body pre code{background:0 0;border:none;padding:0;font-size:inherit;font-family:'JetBrains Mono','Cascadia Code','Fira Code',monospace}.markdown-body hr{margin:1rem 0;border:none;border-top:1px solid #30363d}.markdown-body a{color:#58a6ff;text-decoration:none;font-weight:500}.markdown-body a:hover{text-decoration:underline}.markdown-body table{width:100%;border-collapse:collapse;margin:.65em 0;font-size:.88rem}.markdown-body th,.markdown-body td{border:1px solid #30363d;padding:.4em .55em;text-align:left}.markdown-body th{background:#21262d;font-weight:600}.markdown-body img{max-width:100%;height:auto;border-radius:6px}.markdown-body strong{color:#f0f3f6;font-weight:600}.actions{display:flex;gap:.75rem}.actions .btn{flex:1;padding:.65rem;font-weight:600;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}.btn.good{border-color:#3fb950;color:#3fb950}.btn.bad{border-color:#f85149;color:#f85149}.footer{margin-top:1.5rem;font-size:.8rem;font-weight:400;color:#8b949e}
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="toolbar">
        <div class="toolbar-row">
          <label class="field-narrow">Навык
            <select id="skill"></select>
          </label>
          <label class="field-narrow">Подкаталог
            <select id="subfolder"></select>
          </label>
          <label class="field-grow">Фильтр по пути / заголовку
            <input type="search" id="filter" placeholder="например: 5." />
          </label>
        </div>
        <div class="toolbar-row toolbar-row-actions">
          <button type="button" id="reload">Обновить колоду</button>
          <label class="checkbox-label">
            <input type="checkbox" id="onlyMain" />
            Только основные вопросы
          </label>
        </div>
      </div>
    </header>

    <main class="main" id="main">
      <p class="loading hidden" id="loading">Загрузка…</p>
      <p class="error hidden" id="error"></p>
      <section class="card hidden" id="card">
        <p class="meta" id="meta"></p>
        <div class="front-wrap">
          <p class="label">Вопрос</p>
          <div class="front" id="front"></div>
        </div>
        <button type="button" class="reveal" id="reveal">Показать ответ</button>
        <div class="back-wrap hidden" id="backWrap">
          <p class="label">Ответ</p>
          <div class="back markdown-body" id="back"></div>
        </div>
        <div class="actions hidden" id="actions">
          <button type="button" class="btn good" id="good">Помню</button>
          <button type="button" class="btn bad" id="bad">Повторить</button>
        </div>
      </section>
      <p class="empty hidden" id="empty">Карточек нет. Проверь фильтр или добавь заголовки ## / ### в заметки.</p>
    </main>

    <footer class="footer">
      <span id="counter"></span>
    </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
