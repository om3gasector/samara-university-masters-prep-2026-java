<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Повторение</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Подсветка синтаксиса: тема GitHub Dark -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    
    <!-- Библиотека для парсинга Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Санитайзер для безопасности -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <!-- Библиотека подсветки синтаксиса -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="toolbar">
                <div class="toolbar-row">
                    <label class="field-narrow">
                        Навык
                        <select id="skill"></select>
                    </label>
                    <label class="field-narrow">
                        Подкаталог
                        <select id="subfolder" disabled></select>
                    </label>
                    <label class="field-grow">
                        Фильтр по пути / заголовку
                        <input type="text" id="filter" placeholder="">
                    </label>
                </div>
                <div class="toolbar-row-actions">
                    <button id="reload">Обновить колоду</button>
                    <label class="checkbox-label">
                        <input type="checkbox" id="onlyMain">
                        Только основные вопросы
                    </label>
                </div>
            </div>
            <div id="error" class="error hidden"></div>
            <div id="loading" class="loading hidden">Загрузка…</div>
        </div>

        <div id="card" class="card hidden">
            <div id="meta" class="meta"></div>
            
            <div class="label">Вопрос</div>
            <div id="front" class="front"></div>
            
            <button id="reveal" class="reveal">Показать ответ</button>
            
            <div id="backWrap" class="back-wrap hidden">
                <div class="label">Ответ</div>
                <div id="back" class="back markdown-body"></div>
            </div>

            <div id="actions" class="actions hidden">
                <button id="good" class="btn good">Помню</button>
                <button id="bad" class="btn bad">Повторить</button>
            </div>
        </div>

        <div id="empty" class="empty hidden">
            Карточек нет. Проверь фильтр или добавь заголовки ## / ### в заметки.
        </div>

        <div class="footer">
            <span id="counter"></span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
